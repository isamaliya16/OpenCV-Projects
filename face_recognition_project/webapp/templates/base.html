<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F4F8FB">
  <title>{% block title %}FaceKey{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ url_for('static', filename='fonts/bricolage-grotesque-latin-wght-normal.woff2') }}">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ url_for('static', filename='fonts/figtree-latin-wght-normal.woff2') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
